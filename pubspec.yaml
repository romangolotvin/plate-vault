name: plate_vault
description: Collect license plates from any country — scan, rate rarity, share.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.5.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.15.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
